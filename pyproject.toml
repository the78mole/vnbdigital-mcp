[project]
name = "vnbdigital-mcp"
version = "0.1.0"
description = "MCP server for accessing vnbdigital.de grid operator data (Verteilnetzbetreiber)"
authors = [
    { name = "Daniel Glaser", email = "daniel@example.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0",
    "vnbdigital-client>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
    "pytest>=8.0",
    "pytest-cov>=6.0",
]

[project.scripts]
vnbdigital-mcp = "vnbdigital_mcp.server:main"

[project.urls]
Homepage = "https://github.com/the78mole/vnbdigital-mcp"
Repository = "https://github.com/the78mole/vnbdigital-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vnbdigital_mcp"]

# Override vnbdigital-client to use local development version
[tool.uv.sources]
vnbdigital-client = { path = "/home/daniel/GIT/Python/vnbdigital-client", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=vnbdigital_mcp --cov-report=term-missing"
